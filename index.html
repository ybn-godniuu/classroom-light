<!DOCTYPE html>
<html lang="zh-CN">
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>班级照度热力图</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f1f5fb;color:#20334c;font-family:"Microsoft YaHei",system-ui,sans-serif;background-image:radial-gradient(ellipse at 10% 5%,#dceaff,transparent 45%),radial-gradient(ellipse at 95% 90%,#ffe6dd,transparent 40%)}main{max-width:1040px;margin:auto;padding:32px 24px}header{text-align:center}small{color:#57749b;letter-spacing:3px;font-weight:700}h1{font-size:36px;margin:10px 0}header p{color:#62748b;margin:10px 0 24px}.panel{background:#ffffffdd;border:1px solid white;border-radius:26px;padding:26px;box-shadow:0 18px 60px #29486b12}.layout{display:flex;align-items:center;justify-content:center;gap:32px}.board{display:grid;grid-template-columns:54px repeat(6,minmax(0,1fr));grid-template-rows:repeat(7,auto) 35px;width:min(100%,620px);gap:7px}.rowlabel,.collabel{display:flex;align-items:center;justify-content:center;font-size:14px;color:#61748d;font-weight:600}.cell{aspect-ratio:1; height:auto; width:100%;min-width:0;border:1px solid #dce5f0;border-radius:9px;background:#edf2f8;text-align:center;font:600 22px system-ui;color:#35465a;outline:none;transition:background .2s,box-shadow .2s;appearance:textfield}.cell::-webkit-inner-spin-button,.cell::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}.cell{padding:0;-moz-appearance:textfield;font-variant-numeric:tabular-nums;line-height:normal}.cell:focus{box-shadow:0 0 0 3px #203b6580;z-index:1}.cell:invalid{outline:3px solid #bd234c}.legend{width:200px;flex-shrink:0}.legend h2{font-size:18px;margin:0 0 8px}.legend p{font-size:13px;color:#6c7d91;line-height:1.8}.scale{height:16px;border-radius:8px;background:linear-gradient(90deg,#d5eaff,#80cfc4,#f2d478,#f39b66,#cf3345);margin:20px 0 8px}.ends{display:flex;justify-content:space-between;font-size:12px;color:#667990}.key{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:13px}.dot{width:20px;height:20px;border-radius:5px}.actions{display:flex;justify-content:center;gap:12px;margin-top:24px}button{border:1px solid #cfdae9;background:white;color:#34506f;padding:10px 20px;border-radius:10px;font:inherit;cursor:pointer}button:first-child{background:#294d78;color:white;border-color:#294d78}button:hover{filter:brightness(.96)}#status{text-align:center;color:#63758c;font-size:13px;min-height:20px;margin:15px 0 0}footer{text-align:center;color:#7b8ca1;font-size:12px;margin:20px}@media(max-width:750px){main{padding:24px 12px}.panel{padding:14px}.layout{flex-direction:column;gap:16px}.legend{width:100%}.keys{display:flex;flex-wrap:wrap;gap:8px 16px}.key{margin-top:4px}.board{gap:4px;grid-template-columns:42px repeat(6,minmax(0,1fr))}.rowlabel,.collabel{font-size:11px}h1{font-size:28px}}
</style>
<main><header><small>MATH EXPLORER · 五年级数学</small><h1>班级照度热力图</h1><p>记录班级各处的照度，观察光线分布</p></header><section class="panel"><div class="layout"><div class="board" id="board" aria-label="七行六列班级照度热力图"></div><aside class="legend"><h2>读懂颜色</h2><p>点击方格输入 1–50000 的整数。<br>数字越大，颜色越接近红色。</p><div class="scale"></div><div class="ends"><span>低 · 蓝色</span><span>高 · 红色</span></div><div class="keys" id="keys"></div><p>共五个颜色区间，同一区间使用相同颜色。大于 2000，统一显示最深红色。</p></aside></div><div class="actions"><button id="demo">填入示例数据</button><button id="clear">清空网格</button></div><p id="status" role="status">从任意一个方格开始探索吧</p></section><footer>课堂小思考：哪些区域的数值更大？你能从颜色中发现什么？</footer></main>
<script>
const colors=['#d5eaff','#80cfc4','#f2d478','#f39b66','#cf3345'];
const labels=['一','二','三','四','五','六','七'];const cells=[];
function color(n){return colors[n<=300?0:n<=500?1:n<=1500?2:n<=2000?3:4]}
function paint(el){let n=Number(el.value);if(el.value===''||!el.validity.valid){el.style.background='#edf2f8';el.style.color='#35465a';return}el.style.background=color(n);el.style.color=n>2000?'#fff':'#20334c'}
for(let r=7;r>=1;r--){let label=document.createElement('div');label.className='rowlabel';label.textContent='第'+labels[r-1]+'行';board.append(label);for(let c=1;c<=6;c++){let el=document.createElement('input');el.type='number';el.min=1;el.max=50000;el.step=1;el.inputMode='numeric';el.className='cell';el.setAttribute('aria-label','第'+labels[r-1]+'行，第'+labels[c-1]+'列');el.addEventListener('input',()=>{paint(el);statusText.textContent=el.validity.valid?'已填写 '+cells.filter(x=>x.value!==''&&x.validity.valid).length+' / 42 个方格':'请输入 1–50000 的整数';});board.append(el);cells.push(el)}}
board.append(document.createElement('div'));labels.slice(0,6).forEach(x=>{let el=document.createElement('div');el.className='collabel';el.textContent='第'+x+'列';board.append(el)});
function fitNumbers(){cells.forEach(el=>{el.style.fontSize=Math.min(22,Math.max(8,(el.getBoundingClientRect().width-6)/3.4))+'px'})}
const gridResizeObserver=new ResizeObserver(fitNumbers);gridResizeObserver.observe(board);fitNumbers();
const statusText=document.getElementById('status');['1–300','301–500','501–1500','1501–2000','2001–50000'].forEach((x,i)=>{let el=document.createElement('div');el.className='key';let dot=document.createElement('span');dot.className='dot';dot.style.background=colors[i];el.append(dot,document.createTextNode(x));keys.append(el)});
demo.onclick=()=>{cells.forEach((el,i)=>{el.value=Math.round(80+(6-Math.floor(i/6))*240+(i%6)*180+(i%3)*80);paint(el)});statusText.textContent='示例已填入，可点击任意方格修改'};
clear.onclick=()=>{cells.forEach(el=>{el.value='';paint(el)});statusText.textContent='网格已清空';cells[0].focus()};
</script>
</html>
